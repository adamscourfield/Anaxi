name: Arbor nightly sync

on:
  # London is UTC+1 in summer and UTC in winter. The endpoint below only runs
  # when it is 2am in London, so one of these two calls safely exits each day.
  schedule:
    - cron: "0 1,2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the protected Anaxi sync
        env:
          ANAXI_APP_URL: ${{ secrets.ANAXI_APP_URL }}
          ANAXI_CRON_SECRET: ${{ secrets.ANAXI_CRON_SECRET }}
        run: |
          test -n "$ANAXI_APP_URL"
          test -n "$ANAXI_CRON_SECRET"
          curl --fail --silent --show-error \
            --retry 2 \
            --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
            "${ANAXI_APP_URL%/}/api/cron/arbor-students"
          curl --fail --silent --show-error \
            --retry 2 \
            --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
            "${ANAXI_APP_URL%/}/api/cron/arbor-staff"
          for _ in $(seq 1 8); do
            curl --fail --silent --show-error \
              --retry 2 \
              --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
              "${ANAXI_APP_URL%/}/api/cron/arbor-photos"
          done
          # Each call imports at most seven completed days. Repeating it lets the
          # first run catch up the academic year without requiring a larger plan.
          for _ in $(seq 1 8); do
            curl --fail --silent --show-error \
              --retry 2 \
              --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
            "${ANAXI_APP_URL%/}/api/cron/arbor-attendance"
          done
          for _ in $(seq 1 8); do
            curl --fail --silent --show-error \
              --retry 2 \
              --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
              "${ANAXI_APP_URL%/}/api/cron/arbor-behaviour"
          done
          curl --fail --silent --show-error \
            --retry 2 \
            --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
            "${ANAXI_APP_URL%/}/api/cron/compute-student-flags"
