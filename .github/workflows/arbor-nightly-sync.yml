name: Arbor nightly sync

on:
  # GitHub scheduling can be delayed. Each protected job is idempotent and can
  # safely run whenever the scheduled call reaches Anaxi.
  schedule:
    - cron: "0 1,2 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Data to refresh
        type: choice
        default: all
        options: [all, behaviour, attendance, attendance-schema]

# Prevent the full nightly catch-up and a lighter progress pass from querying
# the same Arbor assessment catalogue concurrently.
concurrency:
  group: arbor-assessment-discovery
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect statutory attendance schema
        if: ${{ inputs.scope == 'attendance-schema' }}
        env:
          ANAXI_APP_URL: ${{ secrets.ANAXI_APP_URL }}
          ANAXI_CRON_SECRET: ${{ secrets.ANAXI_CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
            "${ANAXI_APP_URL%/}/api/cron/arbor-attendance-schema"
      - name: Catch up attendance totals
        if: ${{ inputs.scope != 'behaviour' && inputs.scope != 'attendance-schema' }}
        env:
          ANAXI_APP_URL: ${{ secrets.ANAXI_APP_URL }}
          ANAXI_CRON_SECRET: ${{ secrets.ANAXI_CRON_SECRET }}
        run: |
          test -n "$ANAXI_APP_URL"
          test -n "$ANAXI_CRON_SECRET"
          # Attendance runs first so unrelated catalogue jobs cannot delay it.
          # Each request imports at most seven days; eight cover the current backlog.
          for batch in $(seq 1 8); do
            for attempt in $(seq 1 3); do
              # Arbor shares its request allowance with the other school syncs.
              # Allow the window to reset before each batch and any 429 retry.
              sleep 60
              curl --fail --silent --show-error --retry 2 \
                --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
                "${ANAXI_APP_URL%/}/api/cron/arbor-attendance" > /tmp/attendance-result.json
              set +e
              python3 - <<'PYTHON'
          import json, sys
          d = json.load(open("/tmp/attendance-result.json"))
          print(json.dumps(d))
          connections = d.get("connections")
          if "skipped" in d or not isinstance(connections, list):
              sys.exit(1)
          failed = [c for c in connections if not c.get("ok") or not isinstance(c.get("body"), dict) or "error" in c["body"]]
          if failed:
              sys.exit(2 if all("429" in str(c.get("body")) for c in failed) else 1)
          PYTHON
              result=$?
              set -e
              if [ "$result" -eq 0 ]; then break; fi
              if [ "$result" -ne 2 ] || [ "$attempt" -eq 3 ]; then
                echo "Attendance catch-up failed; see the response above."
                exit 1
              fi
              echo "Arbor rate limited this batch; waiting before retrying."
            done
          done
      - name: Trigger the protected Anaxi sync
        if: ${{ inputs.scope != 'behaviour' && inputs.scope != 'attendance' && inputs.scope != 'attendance-schema' }}
        env:
          ANAXI_APP_URL: ${{ secrets.ANAXI_APP_URL }}
          ANAXI_CRON_SECRET: ${{ secrets.ANAXI_CRON_SECRET }}
        run: |
          test -n "$ANAXI_APP_URL"
          test -n "$ANAXI_CRON_SECRET"
          curl --fail --silent --show-error \
            --retry 2 \
            --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
            "${ANAXI_APP_URL%/}/api/cron/arbor-students"
          curl --fail --silent --show-error \
            --retry 2 \
            --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
            "${ANAXI_APP_URL%/}/api/cron/arbor-staff"
          curl --fail --silent --show-error \
            --retry 2 \
            --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
            "${ANAXI_APP_URL%/}/api/cron/arbor-staff-provisioning"
          # Timetable roster pages are deliberately small to stay within function
          # limits. Repeat the protected call to complete a whole school overnight.
          # Current direct class enrolments span 25 pages for the largest
          # connected school. Leave headroom so a nightly run always finishes.
          for _ in $(seq 1 32); do
            curl --fail --silent --show-error \
              --retry 2 \
              --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
              "${ANAXI_APP_URL%/}/api/cron/arbor-timetable"
          done
          # Historic class staffing is versioned. A mapping change starts a
          # replacement pass automatically; each request advances five pages.
          for _ in $(seq 1 42); do
            curl --fail --silent --show-error \
              --retry 2 \
              --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
              "${ANAXI_APP_URL%/}/api/cron/arbor-timetable-historic"
          done
          for _ in $(seq 1 8); do
            curl --fail --silent --show-error \
              --retry 2 \
              --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
              "${ANAXI_APP_URL%/}/api/cron/arbor-photos"
          done
          for _ in $(seq 1 8); do
            curl --fail --silent --show-error \
              --retry 2 \
              --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
            "${ANAXI_APP_URL%/}/api/cron/arbor-behaviour"
          done
          # Each request is internally paced. Repeating this finishes a historic
          # catalogue in a single overnight run without overloading Arbor.
          for _ in $(seq 1 36); do
            curl --fail --silent --show-error \
              --retry 1 \
              --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
              "${ANAXI_APP_URL%/}/api/cron/arbor-assessments"
            sleep 5
          done
          curl --fail --silent --show-error \
            --retry 2 \
            --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
            "${ANAXI_APP_URL%/}/api/cron/compute-student-flags"
      - name: Catch up behaviour totals
        if: ${{ inputs.scope == 'behaviour' }}
        env:
          ANAXI_APP_URL: ${{ secrets.ANAXI_APP_URL }}
          ANAXI_CRON_SECRET: ${{ secrets.ANAXI_CRON_SECRET }}
        run: |
          test -n "$ANAXI_APP_URL"
          test -n "$ANAXI_CRON_SECRET"
          for _ in $(seq 1 8); do
            curl --fail --silent --show-error --retry 2 \
              --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
              "${ANAXI_APP_URL%/}/api/cron/arbor-behaviour" > /tmp/behaviour-result.json
            python3 -c 'import json; d=json.load(open("/tmp/behaviour-result.json")); print(json.dumps(d)); assert "skipped" not in d and all(c["ok"] and isinstance(c.get("body"), dict) for c in d.get("connections", [])), "Behaviour sync did not complete"'
          done
