name: Arbor assessment progress

on:
  # This is a bounded, read-only request. Run it throughout the day so delayed
  # GitHub scheduled events cannot miss a narrow overnight time window.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Do not run two discovery passes against Arbor at the same time.
concurrency:
  group: arbor-assessment-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Progress protected Arbor assessment discovery
        env:
          ANAXI_APP_URL: ${{ secrets.ANAXI_APP_URL }}
          ANAXI_CRON_SECRET: ${{ secrets.ANAXI_CRON_SECRET }}
        run: |
          test -n "$ANAXI_APP_URL"
          test -n "$ANAXI_CRON_SECRET"
          status=$(curl --silent --show-error \
            --retry 2 \
            --output /dev/null \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $ANAXI_CRON_SECRET" \
            "${ANAXI_APP_URL%/}/api/cron/arbor-assessments?discoveryOnly=1")
          test "$status" -ge 200 -a "$status" -lt 300
